name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  client:
    name: Client — typecheck & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: knip
        run: pnpm knip

      - name: Build
        run: pnpm build
        env:
          # Clerk keys required for Next.js build — use dummy values for CI
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY || 'pk_test_placeholder' }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY || 'sk_test_placeholder' }}
          NEXT_PUBLIC_API_URL: http://localhost:3001

  homepage-e2e:
    name: Homepage — Playwright
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            client/pnpm-lock.yaml
            server/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm install --frozen-lockfile
        working-directory: server

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium --with-deps

      - name: Run homepage tests
        run: pnpm exec playwright test --project=public -env=test
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ZXhjaXRlZC1nYXplbGxlLTg5LmNsZXJrLmFjY291bnRzLmRldiQ
          CLERK_SECRET_KEY: sk_test_QJRTrhkWpp4rfFcEGqrzVi5QaL7cdaN6B0QZrQS4GU
          NEXT_PUBLIC_API_URL: http://localhost:8002
          CLIENT_PORT: 3001
          SERVER_PORT: 8002
          CLERK_TEST_USER_EMAIL: doe+clerk_test@example.com
          CLERK_TEST_USER_PASSWORD: test
          NEXT_PUBLIC_CLERK_SIGN_IN_URL: /sign-in
          NEXT_PUBLIC_STRAVA_CLIENT_ID: 221437
          DATABASE_URL: postgresql://test:test@localhost:5432/testdb
          CLIENT_URL: http://localhost:3001
          PORT: 8002
          OPENAI_API_KEY: sk-placeholder-not-used-in-homepage-tests

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: homepage-playwright-report
          path: client/playwright-report/
          retention-days: 7

  server:
    name: Server — typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: server/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: knip
        run: pnpm knip
